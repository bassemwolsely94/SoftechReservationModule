name: CI

# One run per commit that matters: main, and every pull request. Work-in-progress pushes to
# other branches don't run (open a PR, or start it by hand from the Actions tab), and a commit
# pushed to a PR branch runs once, not twice (push + pull_request).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same PR/branch cancels the older run, so no failure mail arrives for a
# commit that is already replaced. main always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-tests:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elrezeiky_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: 'True'
      PG_NAME: elrezeiky_db
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_HOST: localhost
      PG_PORT: '5432'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests (with coverage)
        run: |
          coverage run manage.py test --noinput --verbosity 2
          # Floor = the measured total, rounded down (R7, 2026-11-05: 73.97%). It never goes down.
          # pipefail: without it `| tail` would hide the --fail-under exit code.
          set -o pipefail
          coverage report --skip-covered --fail-under=73 | tail -40

      - name: Static security scan (bandit, new findings only)
        run: bandit -r apps core config -x apps/tests,migrations -ll -q -b apps/tests/security/bandit-baseline.json

      - name: Dependency advisories (pip-audit, known ones listed)
        run: python apps/tests/security/pip_audit_check.py

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency advisories (npm audit, known ones listed)
        run: node ../apps/tests/security/npm_audit_check.cjs

      - name: Build
        run: npm run build

  frontend-quality:
    name: Frontend lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint, errors fail)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Owner decision Q4 (test plan 2026-11-05): non-blocking for its first week. Remove this line
    # once the job has been green for a week.
    continue-on-error: true

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elrezeiky_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # config.settings_e2e never reads a .env: its own database, no SOFTECH host, no sends.
    env:
      DJANGO_SETTINGS_MODULE: config.settings_e2e
      E2E_PG_NAME: elrezeiky_e2e
      E2E_PG_USER: postgres
      E2E_PG_PASSWORD: postgres
      E2E_PG_HOST: localhost
      E2E_PG_PORT: '5432'
      E2E_PYTHON: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Migrate and seed the e2e database
        run: |
          python manage.py migrate --noinput
          python manage.py seed_e2e_users

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
