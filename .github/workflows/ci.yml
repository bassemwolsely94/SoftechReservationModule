name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elrezeiky_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: 'True'
      PG_NAME: elrezeiky_db
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_HOST: localhost
      PG_PORT: '5432'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests (with coverage)
        run: |
          coverage run manage.py test --noinput --verbosity 2
          coverage report --skip-covered | tail -40

      - name: Static security scan (bandit, new findings only)
        run: bandit -r apps core config -x apps/tests,migrations -ll -q -b apps/tests/security/bandit-baseline.json

      - name: Dependency advisories (pip-audit, known ones listed)
        run: python apps/tests/security/pip_audit_check.py

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency advisories (npm audit, known ones listed)
        run: node ../apps/tests/security/npm_audit_check.cjs

      - name: Build
        run: npm run build
