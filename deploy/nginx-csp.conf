# /etc/nginx/elrezeiky-csp.conf — the SPA's Content-Security-Policy (D-04, full audit 2026-11-15).
# Included inside `location / { }` of deploy/nginx.conf; the two maps there turn the mode into
# exactly one header.
#
# ONE SWITCH — $elr_csp_mode:
#   "enforce"      → Content-Security-Policy             (the browser blocks, and reports)
#   "report-only"  → Content-Security-Policy-Report-Only (the browser only reports)
# Roll back:  sudo sed -i 's/"enforce"/"report-only"/' /etc/nginx/elrezeiky-csp.conf
#             sudo nginx -t && sudo systemctl reload nginx
# Either way, violations still arrive at /api/csp-report/ (logged as elrezeiky.csp;
# `manage.py csp_report_summary` groups them).
#
# This file is the ONE place the policy is written: the Vite preview (frontend/vite.config.js), the
# Django tests (apps/tests/security/test_platform_headers.py) and the CI browser check
# (frontend/e2e/csp.enforce.js) all read it from here. Keep the policy on one line.
#
# Why each non-'self' source is there (the PR for D-04 lists the evidence):
#   style-src 'unsafe-inline'  print windows (receipts, HR forms, vouchers, QR) write <style> blocks
#                              and style="" attributes with document.write; scripts stay strict
#   fonts.googleapis/gstatic   Cairo web font (index.html, print windows)
#   img-src data: blob: https: upload previews (blob:), QR images (api.qrserver.com), map tiles
#                              and Leaflet markers (cdnjs)
#   media-src blob: https:     voice-note preview (blob:); call recordings follow a signed link that
#                              may redirect to the PBX recording host
#   connect-src wss: https:    WebSockets (/ws, softphone SIP over WSS)
#   worker-src blob:           service workers are 'self'; blob: kept for library workers
set $elr_csp_mode "enforce";
set $elr_csp_policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss: https:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report/";
