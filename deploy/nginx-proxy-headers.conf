# /etc/nginx/elrezeiky-proxy-headers.conf — included by every proxy_pass location.
#
# X-Forwarded-For is OVERWRITTEN with the address nginx itself saw, never appended to: the stock
# proxy_params appends, which leaves the client-written entry leftmost, and Daphne's
# --proxy-headers takes the leftmost one. Overwriting gives one value the client cannot forge
# (core/client_ip.py, NUM_PROXIES=1).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
