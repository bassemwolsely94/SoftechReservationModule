# /etc/nginx/sites-available/elrezeiky
# Symlink to /etc/nginx/sites-enabled/elrezeiky to activate
#
# Nginx sits in front of Daphne and handles:
#   - SSL termination (Let's Encrypt)
#   - Static / media file serving (no Python overhead)
#   - WebSocket upgrade (Django Channels)
#   - Rate limiting / connection limits
#   - Gzip compression

upstream django_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate limiting zones — tune as needed
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;
    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_OR_IP;

    # --- SSL (Let's Encrypt via certbot) ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security headers ---
    add_header X-Frame-Options           SAMEORIGIN;
    add_header X-Content-Type-Options    nosniff;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Referrer-Policy           strict-origin-when-cross-origin;

    client_max_body_size 50M;

    # --- Static files (Django collectstatic output) ---
    location /static/ {
        alias /opt/elrezeiky/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Media files ---
    location /media/ {
        alias /opt/elrezeiky/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- Auth endpoints: strict rate limit ---
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://django_backend;
        include /etc/nginx/proxy_params;
    }

    # --- API: moderate rate limit ---
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://django_backend;
        include /etc/nginx/proxy_params;
    }

    # --- WebSocket (Django Channels) ---
    location /ws/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400;   # keep WS open up to 24h
    }

    # --- React SPA: serve index.html for all non-API routes ---
    location / {
        root /opt/elrezeiky/frontend/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    # --- Logging ---
    access_log /var/log/nginx/elrezeiky_access.log;
    error_log  /var/log/nginx/elrezeiky_error.log warn;
}
