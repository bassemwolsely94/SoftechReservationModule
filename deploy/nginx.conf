# /etc/nginx/sites-available/elrezeiky
# Symlink to /etc/nginx/sites-enabled/elrezeiky to activate
#
# Nginx sits in front of Daphne and handles:
#   - SSL termination (Let's Encrypt)
#   - Static / media file serving (no Python overhead)
#   - WebSocket upgrade (Django Channels)
#   - Rate limiting / connection limits
#   - Gzip compression

upstream django_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate limiting zones — tune as needed
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;
    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_OR_IP;

    # --- SSL (Let's Encrypt via certbot) ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security headers ---
    add_header X-Frame-Options           SAMEORIGIN;
    add_header X-Content-Type-Options    nosniff;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Referrer-Policy           strict-origin-when-cross-origin;

    client_max_body_size 50M;

    # --- Static files (Django collectstatic output) ---
    location /static/ {
        alias /opt/elrezeiky/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Django admin: LAN/VPN only (adjust the ranges to your network) ---
    location /admin/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://django_backend;
        include /etc/nginx/proxy_params;
    }

    # --- Media files ---
    # Uploads (prescriptions, insurance documents, payment proofs, HR receipts…)
    # need a signed, unexpired URL: Django (core/media.py) checks the
    # signature and hands the file back to Nginx via X-Accel-Redirect.
    # Set MEDIA_ACCEL_REDIRECT=True in .env when using this config.
    location /media/ {
        proxy_pass http://django_backend;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    # Public product imagery (shared on WhatsApp / portal) — served directly.
    location ~ ^/media/(products|image_candidates|insurance/watermarks)/ {
        root /opt/elrezeiky;              # /media/x → /opt/elrezeiky/media/x
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
        location ~* \.(html?|xhtml|svg|svgz|xml|js|mjs)$ {
            add_header Content-Security-Policy "sandbox" always;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }

    # Only reachable through X-Accel-Redirect from Django — never directly.
    location /protected-media/ {
        internal;
        alias /opt/elrezeiky/media/;
    }

    # --- Auth endpoints: strict rate limit ---
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://django_backend;
        include /etc/nginx/proxy_params;
    }

    # --- API: moderate rate limit ---
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://django_backend;
        include /etc/nginx/proxy_params;
    }

    # --- WebSocket (Django Channels) ---
    location /ws/ {
        # The JWT travels in the ?token= query string — keep it out of access logs.
        access_log off;
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400;   # keep WS open up to 24h
    }

    # --- React SPA: serve index.html for all non-API routes ---
    location / {
        # vite.config.js builds into staticfiles/frontend (build.outDir)
        root /opt/elrezeiky/staticfiles/frontend;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
        # add_header here cancels the server-level ones — repeat the security headers
        add_header X-Frame-Options           SAMEORIGIN always;
        add_header X-Content-Type-Options    nosniff always;
        add_header Referrer-Policy           strict-origin-when-cross-origin always;
        add_header Permissions-Policy        "camera=(self), geolocation=(self), microphone=(self)" always;
    }

    # --- Logging ---
    access_log /var/log/nginx/elrezeiky_access.log;
    error_log  /var/log/nginx/elrezeiky_error.log warn;
}
