; Copy to config.ini next to agent.py and fill in. No PIN and no agent token here: the agent refuses
; to start if this file holds them. They come from a prompt or the environment
; (TAX_TOKEN_PIN, TAX_SIGNING_AGENT_TOKEN).

[server]
; The address the staff use. It must be https; redirects are refused.
url = https://elrezeikyapp.dawalvry.com
; Only if the server's certificate is not trusted by the certifi bundle: path of a PEM file.
ca_bundle =

[token]
; The module the identification script found. Fill in the path it printed; do not guess.
pkcs11_module =
; From `agent.py identify`. With a thumbprint set, the PIN is not tried on any other token.
thumbprint =
; Only if more than one token is ever plugged in.
label =

[agent]
poll_seconds = 5
; The workstation's own record of what was signed: job id, kind and hash, never the text or the PIN.
log_file = C:\ElRezeikyTaxAgent\logs\agent.log
